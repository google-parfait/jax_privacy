[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jax_privacy"
version = "2.3.0.dev0"
description = "Algorithms for Privacy-Preserving Machine Learning in JAX."
authors = [
  { name="Google DeepMind", email="jax-privacy-dev@google.com" },
]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "absl-py>=1.2.0",
    "dp_accounting @ git+https://github.com/google/differential-privacy.git#subdirectory=python/dp_accounting",
    "jax>=0.8.1",
    "jaxlib>=0.8.1",
    "numpy>=2.0.0",
    "optax @ git+https://github.com/google-deepmind/optax.git",
    "scipy>=1.9.2",
]

[project.optional-dependencies]
lint = [
    "flake8",
    "pydocstyle",
    "pylint",
    "pylint-exit",
    "pyrefly",
    "pyink<26.0.0",
    "pyink[jupyter]<26.0.0",
]

test = [
    "chex>=0.1.91",
    "pytest>=7.2.0",
    "pytest-xdist>=2.0.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.54.0",
    "keras>=3.0.0",
    "tensorflow>=2.16.1",
]

examples = [
    "dinosaur",
    "equinox",
    # orbax pulls orbax-checkpoint → uvloop (not supported on Windows)
    "orbax; sys_platform != 'win32'",
    "scikit-learn==1.5.0",
    "grain",
    "keras",
    "tensorflow",
    "tensorflow_datasets",
    "randomgen",
    "importlib_resources",
    "opencv-python",
]

docs = [
    "sphinx<9.0.0",
    "sphinx-book-theme",
    "myst-nb",
    "sphinx-collections",
    "ipykernel",
    "sphinx_autodoc_typehints",
    "tensorflow",
    "keras",
]

dev = [
    "jax_privacy[lint,test,examples,docs]",
    "build",
    "wheel",
]

[project.urls]
Homepage = "https://github.com/google-parfait/jax_privacy"

[tool.setuptools.packages.find]
exclude = ["*_test.py", "examples*", "experiments*"]
namespaces = true

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

# We include pyink to allow external contributors to optionally, but easily,
# pass google internal formatting checks.
[tool.pyink]
line-length = 80
unstable = true
target-version = []
pyink-indentation = 2
pyink-ipynb-indentation = 2
pyink-use-majority-quotes = true
pyink-annotation-pragmas = [
  "noqa",
  "pylint:",
  "type: ignore",
  "pytype:",
  "pyrefly:",
  "mypy:",
  "pyright:",
  "pyre-",
]

[tool.pyrefly]
project-includes = [
  "jax_privacy/**/*.py",
  "tests/**/*.py",
  "examples/**/*.py",
]
python-version = "3.11"
# `basic` is the preset Pyrefly applies to unconfigured projects; pin it so the
# checker level does not silently change just because this config exists.
preset = "basic"

[tool.uv]
override-dependencies = [
  "typing-extensions>=4.15.0",
]


