name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    paths-ignore: ["README.md"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["README.md"]

permissions:
  contents: read

jobs:
  check_rebase:
    name: "Check Branch Sync"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check if PR is up to date
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$PR_AUTHOR" = "copybara-service[bot]" ]; then
            echo "Automated sync PR; skipping branch sync check."
            exit 0
          fi
          git fetch origin main
          BEHIND=$(git rev-list --count HEAD..origin/main)
          if [ "$BEHIND" -gt 0 ]; then
            echo "This branch is $BEHIND commit(s) behind main."
            echo "Please rebase your branch on the latest main by running:"
            echo ""
            echo "  git fetch origin main"
            echo "  git rebase origin/main"
            echo ""
            echo "Then force push to your fork and this pull request:"
            echo "  git push --force-with-lease"
            echo ""
            exit 1
          else
            echo "Branch is up to date with main."
          fi
  markdown-lint:
    name: "Lint: Markdown"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Enforce the 80-column line limit (MD013); see .markdownlint-cli2.jsonc.
      - name: Lint Markdown line length
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          globs: "**/*.md"

  check-lockfile:
    name: "Check: pylock.toml Sync"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check if pyproject.toml was modified
        id: check_pyproject
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GH_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$GH_BASE_REF" --depth=1
            BASE_REF="origin/$GH_BASE_REF"
          else
            BASE_REF="HEAD~1"
          fi
          if git diff --name-only "$BASE_REF" HEAD | grep -q '^pyproject.toml$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "pyproject.toml was modified. Validating pylock.toml sync..."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pyproject.toml was not modified. Skipping lockfile sync check."
          fi
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        if: steps.check_pyproject.outputs.changed == 'true'
        with:
          enable-cache: true
      - name: Verify pylock.toml is up to date with pyproject.toml
        if: steps.check_pyproject.outputs.changed == 'true'
        run: |
          uv export -q --format pylock.toml --all-extras --default-index https://pypi.org/simple -o pylock.toml
          go run github.com/google/addlicense@v1.2.0 -c "DeepMind Technologies Limited" -y "2026" -l apache pylock.toml
          git diff --stat pylock.toml
          git diff --exit-code pylock.toml

  lint:
    name: "Lint: Python 3.11"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Install Dependencies
        run: |
          uv pip install --system -r pylock.toml
      - name: Run flake
        run: |
          flake8 jax_privacy tests examples
      - name: Check formatting with Pyink
        run: |
          pyink --check --diff jax_privacy tests examples || { echo -e "\n---> Formatting check failed. To fix, run \`uv pip install pyink pyink[jupyter] && pyink jax_privacy tests examples\` locally and commit the changes." >&2; exit 1; }
      - name: Run pydocstyle
        run: |
          pydocstyle --convention=google --add-ignore=D101,D102,D103,D105,D202,D402 jax_privacy/
      - name: Run pylint
        shell: bash
        run: |
          pylint --rcfile=.pylintrc jax_privacy || pylint-exit -efail -wfail -cfail -rfail $?
          pylint --rcfile=.pylintrc examples || pylint-exit -efail -wfail -cfail -rfail $?
          pylint --rcfile=.pylintrc tests -d W0101,W0212,C0114 || pylint-exit -efail -wfail -cfail -rfail $?
      - name: Run pyrefly
        run: |
          pyrefly check

  test:
    name: "Unit Test: Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Install Dependencies
        run: |
          uv pip install --system -r pylock.toml

      # 1. Linux: Full Power (Parallel + Coverage)
      - name: Run Doctests (Linux)
        if: runner.os == 'Linux'
        run: |
          pytest --doctest-modules jax_privacy
      - name: Run Standard Tests (Linux)
        if: runner.os == 'Linux'
        run: |
          pytest -n auto tests/ -k "not matrix_factorization and not distributed_noise_generation_test and not sharding_utils_test and not _random_test and not keras_api_e2e_test" --junitxml=report1.xml --cov=jax_privacy --cov-report=xml
          pytest -n auto tests/distributed_noise_generation_test.py --junitxml=report2.xml --cov=jax_privacy --cov-report=xml --cov-append
          pytest -n auto tests/sharding_utils_test.py tests/_random_test.py --junitxml=report3.xml --cov=jax_privacy --cov-report=xml --cov-append

  matrix-tests:
    name: "Heavy Tests: Linux Only"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Install Dependencies
        run: |
          uv pip install --system -r pylock.toml
      - name: Run Heavy Tests
        env:
          HYPOTHESIS_PROFILE: dpftrl_default
        run: |
          pytest -n auto tests/ -k "matrix_factorization or keras_api_e2e_test" --ignore=tests/matrix_factorization/buffered_toeplitz_test.py
          # The rest of buffered_toeplitz_test.py is ignored (timeouts), but
          # the closed-form optimizer accuracy tests are fast and were the
          # only coverage of the Mathias-bound rtol table.
          pytest tests/matrix_factorization/buffered_toeplitz_test.py -k "test_optimize_single_participation"
        shell: bash



  docs:
    name: "Docs: Python 3.11"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Install Dependencies
        run: |
          uv pip install --system -r pylock.toml
      - name: Build Sphinx
        run: |
          cd docs
          sphinx-build -W -b html . _build/html
