# This workflow runs examples daily to ensure they are working properly.
# It was moved out of ci.yml to speed up per-commit CI.
name: examples

on:
  schedule:
    - cron: "0 17 * * *"  # Daily at 09:00 PST (17:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    name: "Examples: Python 3.12 on Linux"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Install Dependencies
        run: |
          uv pip install --system -r pylock.toml
      - name: Run Examples
        run: |
          echo "::group::keras_api_example"
          python examples/keras_api_example.py
          echo "::endgroup::"
          echo "::group::jax_api_example"
          python examples/jax_api_example.py
          echo "::endgroup::"
          echo "::group::dp_logistic_regression"
          python examples/dp_logistic_regression.py
          echo "::endgroup::"
          echo "::group::dp_sgd_transformer"
          python examples/dp_sgd_transformer.py
          echo "::endgroup::"
          echo "::group::dpmf_strategy_optimization"
          python examples/dpmf_strategy_optimization.py
          echo "::endgroup::"
          echo "::group::balls_in_bins_accounting"
          python examples/balls_in_bins_accounting.py
          echo "::endgroup::"
          echo "::group::data_loading"
          python examples/data_loading.py
          echo "::endgroup::"
