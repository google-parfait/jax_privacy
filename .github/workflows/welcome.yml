name: Welcome First-Time Contributors

on:
  # Safe use of workflow_run: never checks out or executes untrusted PR code;
  # only calls the GitHub REST API to welcome first-time PR contributors.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["ci"]
    types: [completed]

permissions:
  pull-requests: write
  issues: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.actor != 'copybara-service[bot]'
    steps:
      - name: Welcome first-time contributor
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = context.payload.workflow_run.head_sha;
            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const pr = pulls.data.find((p) => p.head.sha === headSha);
            if (!pr || pr.user.type === 'Bot') {
              return;
            }

            const priorPrs = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:pr author:${pr.user.login}`,
              per_page: 5,
            });
            if (priorPrs.data.items.some((item) => item.number !== pr.number)) {
              return;
            }

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const marker = 'Welcome, and thanks for opening your first PR!';
            if (comments.data.some((c) => c.body && c.body.includes(marker))) {
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body: [
                '👋 **Welcome, and thanks for opening your first PR!**',
                '',
                "We're excited to have you contribute. A few things to help you get started:",
                '',
                "- **Join the community!** Say hello in the [#google-dp channel](https://app.slack.com/client/T01DHFZ2E4D/C0CJK1PGGNA) on the [OpenDP Slack](https://join.slack.com/t/opendp/shared_invite/zt-1aca9bm7k-hG7olKz6CiGm8htI2lxE8w), we'd love to hear who you are, what you're working on, and what brought you here.",
                "- **A maintainer will review your PR shortly.** If you have questions in the meantime, don't hesitate to ask here or on Slack.",
                '',
                'Thanks for contributing to privacy-preserving machine learning! 🔐',
              ].join('\n'),
            });
