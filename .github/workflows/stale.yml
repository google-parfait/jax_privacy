name: Stale Issues and PRs

on:
  schedule:
    - cron: '30 1 * * *' # Run daily at 1:30 AM UTC

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Disable completely for Issues
          days-before-stale: -1
          days-before-close: -1

          # Enable for PRs (exempt PRs already approved or awaiting internal merge)
          days-before-pr-stale: 21
          days-before-pr-close: 30
          exempt-pr-labels: 'approved,awaiting-google-merge,keep-open'

          # Messages
          stale-pr-message: 'This PR has been idle for 21 days. Please post a comment if it is still active or awaiting review.'
          close-pr-message: 'This PR has been idle for an additional 30 days since being marked as stale. Closing this PR; feel free to comment to reopen.'
